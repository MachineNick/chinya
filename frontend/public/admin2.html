<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — WinzoIndia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin2.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════
     GATE
════════════════════════════════════════════════ -->
<div id="gate-wrap">
  <div class="a2-gate-card">
    <div class="a2-gate-logo">
      <div class="brand-mark">W</div>
      <span>WinzoIndia</span>
    </div>
    <h2>Admin Console</h2>
    <p>Enter your passcode to access the dashboard.</p>
    <form id="gate-form">
      <div class="field">
        <label>Passcode</label>
        <input id="passcode" type="password" placeholder="••••••••••" required />
        <span class="hint">Default: <code>winzo-admin-2026</code></span>
      </div>
      <div id="gate-error" class="form-error"></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">
        <i class="ph-fill ph-lock-open"></i> Unlock Dashboard
      </button>
    </form>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     DASHBOARD SHELL
════════════════════════════════════════════════ -->
<div id="dash-wrap" style="display:none;">

  <!-- Sidebar -->
  <aside class="a2-sidebar" id="sidebar">
    <div class="a2-sidebar-logo">
      <div class="brand-mark">W</div>
      <span class="brand-name">Winzo<span style="color:var(--accent)">India</span></span>
    </div>

    <nav class="a2-nav">

      <!-- Setup -->
      <div class="a2-nav-group">
        <button class="a2-nav-parent" data-group="setup">
          <i class="ph ph-gear"></i> Setup
          <i class="ph ph-caret-down a2-caret"></i>
        </button>
        <div class="a2-nav-children" id="group-setup">
          <button class="a2-nav-child" data-panel="deposit-report"><i class="ph ph-receipt"></i> Deposit Transaction Report</button>
          <button class="a2-nav-child" data-panel="challenges-setup"><i class="ph ph-sword"></i> Challenges</button>
          <button class="a2-nav-child" data-panel="blacklisted"><i class="ph ph-prohibit"></i> Blacklisted Names</button>
        </div>
      </div>

      <!-- Game Management -->
      <div class="a2-nav-group">
        <button class="a2-nav-parent" data-group="games">
          <i class="ph ph-game-controller"></i> Game Management
          <i class="ph ph-caret-down a2-caret"></i>
        </button>
        <div class="a2-nav-children" id="group-games">
          <button class="a2-nav-child" data-panel="view-all-games"><i class="ph ph-list-bullets"></i> View All Games</button>
          <button class="a2-nav-child" data-panel="add-game"><i class="ph ph-plus-circle"></i> Add New Game</button>
        </div>
      </div>

      <!-- User Management -->
      <div class="a2-nav-group">
        <button class="a2-nav-parent" data-group="users">
          <i class="ph ph-users"></i> User Management
          <i class="ph ph-caret-down a2-caret"></i>
        </button>
        <div class="a2-nav-children" id="group-users">
          <button class="a2-nav-child" data-panel="view-all-users"><i class="ph ph-user-list"></i> View All Users</button>
          <button class="a2-nav-child" data-panel="add-user"><i class="ph ph-user-plus"></i> Add New User</button>
          <button class="a2-nav-child" data-panel="review-kyc"><i class="ph ph-identification-card"></i> Review KYC Users</button>
          <button class="a2-nav-child" data-panel="fraud-users"><i class="ph ph-warning-octagon"></i> View Fraud Users</button>
          <button class="a2-nav-child" data-panel="wallet-mismatch"><i class="ph ph-scales"></i> Wallet Mismatch Users</button>
        </div>
      </div>

      <!-- Challenge Management -->
      <div class="a2-nav-group">
        <button class="a2-nav-parent" data-group="challenges">
          <i class="ph ph-sword"></i> Challenge Management
          <i class="ph ph-caret-down a2-caret"></i>
        </button>
        <div class="a2-nav-children" id="group-challenges">
          <button class="a2-nav-child" data-panel="challenges-24h"><i class="ph ph-clock-countdown"></i> Last 24h Challenges</button>
          <button class="a2-nav-child" data-panel="running-challenges"><i class="ph ph-spinner-gap"></i> Running Challenges</button>
          <button class="a2-nav-child" data-panel="search-challenges"><i class="ph ph-magnifying-glass"></i> Search Challenges</button>
          <button class="a2-nav-child" data-panel="search-screenshots"><i class="ph ph-image-square"></i> Search Screenshots</button>
          <button class="a2-nav-child" data-panel="all-challenges"><i class="ph ph-stack"></i> View All Challenges</button>
        </div>
      </div>

      <!-- Transaction Management -->
      <div class="a2-nav-group">
        <button class="a2-nav-parent" data-group="transactions">
          <i class="ph ph-currency-inr"></i> Transaction Management
          <i class="ph ph-caret-down a2-caret"></i>
        </button>
        <div class="a2-nav-children" id="group-transactions">
          <button class="a2-nav-child" data-panel="new-deposit-requests"><i class="ph ph-bell-ringing"></i> New Deposit Requests</button>
          <button class="a2-nav-child" data-panel="deposits-2h"><i class="ph ph-clock"></i> Last 2h Deposits</button>
          <button class="a2-nav-child" data-panel="recent-withdrawals"><i class="ph ph-arrow-up-right"></i> Recent Withdrawal Requests</button>
          <button class="a2-nav-child" data-panel="all-deposits"><i class="ph ph-arrow-down-left"></i> View All Deposits</button>
          <button class="a2-nav-child" data-panel="all-withdrawals"><i class="ph ph-list-checks"></i> View All Withdraw Requests</button>
          <button class="a2-nav-child" data-panel="manual-deposit"><i class="ph ph-plus"></i> Manual Deposit (Admin)</button>
          <button class="a2-nav-child" data-panel="manual-withdraw-haoda"><i class="ph ph-hand-withdraw"></i> Manual Withdraw (Haoda)</button>
          <button class="a2-nav-child" data-panel="manual-withdraw-admin"><i class="ph ph-hand-coins"></i> Manual Withdraw (Admin)</button>
        </div>
      </div>

      <!-- Settings -->
      <div class="a2-nav-group">
        <button class="a2-nav-child" data-panel="settings" style="width:100%;text-align:left;padding:10px 16px;">
          <i class="ph ph-sliders"></i> Settings
        </button>
      </div>

    </nav>

    <div class="a2-sidebar-footer">
      <a href="dashboard.html" class="btn btn-secondary" style="width:100%;justify-content:center;font-size:12px;padding:10px;">
        <i class="ph ph-sign-out"></i> Exit to Site
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="a2-main">
    <header class="a2-topbar">
      <button class="a2-menu-toggle" id="menu-toggle"><i class="ph ph-list"></i></button>
      <div class="a2-topbar-title" id="topbar-title">Dashboard Overview</div>
      <div class="a2-topbar-right">
        <span class="a2-badge-admin"><i class="ph-fill ph-shield-check"></i> Admin</span>
      </div>
    </header>

    <div class="a2-content" id="main-content">
      <!-- panels injected by JS -->
    </div>
  </div>

</div><!-- end dash-wrap -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin2-data.js"></script>
<script src="js/admin2-panels1.js"></script>
<script src="js/admin2-panels2.js"></script>
<script src="js/admin2.js"></script>
</body>
</html>
