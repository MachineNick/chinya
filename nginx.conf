server {
    listen 80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;

    root /var/www/winzo/public;
    index index.html;

    # Security headers (mirrors vercel.json)
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://gateway.storjshare.io; frame-ancestors 'none';";

    # Clean URLs (mirrors vercel.json rewrites)
    location = /dashboard  { try_files /dashboard.html =404; }
    location = /login      { try_files /login.html =404; }
    location = /signup     { try_files /signup.html =404; }
    location = /profile    { try_files /profile.html =404; }
    location = /admin      { try_files /admin.html =404; }
    location = /ludo       { try_files /ludo.html =404; }
    location = /snake-ladder { try_files /snake-ladder.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
